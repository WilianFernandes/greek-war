<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#06020f;font-family:Georgia,serif}
#c{position:absolute;top:0;left:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 10px;gap:6px;pointer-events:none}
.panel{background:rgba(0,0,0,.8);border:1px solid #4a3010;border-radius:8px;padding:5px 10px;min-width:105px;pointer-events:auto}
.plbl{font-size:9px;color:#7a5820;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.bw{height:7px;background:#0a0808;border-radius:4px;overflow:hidden}
.bf{height:7px;border-radius:4px;transition:width .25s}
.bg{background:linear-gradient(90deg,#164010,#38b818)}
.br{background:linear-gradient(90deg,#5c0808,#c82020)}
.bt{font-size:9px;color:#6a4818;margin-top:2px}
#mid{text-align:center;flex:1}
.res{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.8);border:1px solid;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:bold;margin:0 2px}
.rg{border-color:#b08820;color:#e8c840}.rm{border-color:#3860b8;color:#80a8f0}

#upg{position:absolute;top:52px;right:8px;z-index:10;display:flex;flex-direction:column;gap:3px}
.ub{background:rgba(4,2,10,.9);border:1px solid #3a2808;border-radius:6px;color:#b89040;font-size:9px;padding:4px 8px;cursor:pointer;white-space:nowrap;font-family:Georgia,serif;min-height:30px}
.ub:active{border-color:#c9a227;transform:scale(.97)}.ub:disabled{opacity:.25;pointer-events:none}
.ulbl{font-size:8px;color:#3a2008;text-transform:uppercase;letter-spacing:1px;padding:2px 0}
#shop{position:absolute;bottom:0;left:0;right:0;height:27%;background:rgba(2,1,8,.94);border-top:1px solid #2a1408;display:flex;align-items:center;gap:4px;padding:0 6px;overflow-x:auto;z-index:10;-webkit-overflow-scrolling:touch}

.sb{background:rgba(8,4,2,.93);border:1px solid #2a1808;border-radius:7px;color:#b89040;font-family:Georgia,serif;font-size:9px;padding:4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px;flex-shrink:0;min-height:46px;justify-content:center}

#ibanner{display:none;position:absolute;top:0;left:0;right:0;z-index:15;background:rgba(16,8,2,.96);border-bottom:1px solid #c9a227;padding:7px 12px;align-items:center;justify-content:space-between;gap:8px}
#ibanner.show{display:flex}
#ibanner span{color:#b89040;font-size:11px;flex:1}
#ibtn{background:#c9a227;color:#04020a;border:none;border-radius:6px;padding:5px 12px;font-family:Georgia,serif;font-size:11px;font-weight:bold;cursor:pointer;min-height:34px}
#iclose{background:none;border:none;color:#6a4818;font-size:16px;cursor:pointer;padding:0 4px;min-width:28px}

<script>
'use strict';
// ─── PWA ────────────────────────────────────────────────────
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_deferredPrompt=e;setTimeout(()=>document.getElementById('ibanner').classList.add('show'),4000);});
function installPWA(){if(!_deferredPrompt)return;_deferredPrompt.prompt();_deferredPrompt.userChoice.then(()=>{_deferredPrompt=null;document.getElementById('ibanner').classList.remove('show');});}
window.addEventListener('appinstalled',()=>document.getElementById('ibanner').classList.remove('show'));
document.addEventListener('touchstart',()=>{try{screen.orientation.lock('landscape');}catch(e){}},{once:true});

// ─── CANVAS ──────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
let W=0,H=0,GY=0; // GY = ground Y
let bgCanvas=null,bgDirty=true;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  GY=Math.floor(H*0.72);
  bgDirty=true;
}
window.addEventListener('resize',resize);
resize();

// ─── SEEDED RNG ──────────────────────────────────────────────
function rng32(seed){let s=seed;return()=>{s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296;};}

// ─── BACKGROUND PRE-RENDER ───────────────────────────────────
function buildBG(){
  bgCanvas=new OffscreenCanvas(W,H);
  const g=bgCanvas.getContext('2d');
  const r=rng32(777);

  // Sky
  const sk=g.createLinearGradient(0,0,0,GY);
  sk.addColorStop(0,'#010006');sk.addColorStop(.3,'#070218');sk.addColorStop(.65,'#1e0630');sk.addColorStop(1,'#2e0b1a');
  g.fillStyle=sk;g.fillRect(0,0,W,GY+2);

  // Stars
  for(let i=0;i<220;i++){
    const sx=r()*W,sy=r()*GY*.88,sr=r()*1.5+.3,a=r()*.75+.15;
    g.fillStyle=`rgba(255,252,${200+Math.floor(r()*55)},${a})`;
    g.beginPath();g.arc(sx,sy,sr,0,6.28);g.fill();
  }
  // Shooting star
  g.strokeStyle='rgba(255,240,180,0.4)';g.lineWidth=1;
  g.beginPath();g.moveTo(W*.15,GY*.08);g.lineTo(W*.28,GY*.15);g.stroke();

  // Moon
  const mx=W*.83,my=H*.07,mr=H*.044;
  const mg=g.createRadialGradient(mx,my,mr*.08,mx,my,mr*2.8);
  mg.addColorStop(0,'rgba(255,248,200,.18)');mg.addColorStop(.5,'rgba(220,175,60,.06)');mg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=mg;g.beginPath();g.arc(mx,my,mr*2.8,0,6.28);g.fill();
  const md=g.createRadialGradient(mx-mr*.3,my-mr*.25,mr*.05,mx,my,mr);
  md.addColorStop(0,'#fffce0');md.addColorStop(.55,'#f0d060');md.addColorStop(1,'#c09020');
  g.fillStyle=md;g.beginPath();g.arc(mx,my,mr,0,6.28);g.fill();
  // craters
  g.fillStyle='rgba(80,50,0,.14)';
  [[-.3,-.25,.18],[.25,.12,.11],[-.1,.3,.08]].forEach(([dx,dy,cr])=>{g.beginPath();g.arc(mx+dx*mr,my+dy*mr,cr*mr,0,6.28);g.fill();});

  // Far mountain range
  drawMtnLayer(g,W,GY,.32,7,'#0c0320',10,.5);
  // Mid range
  drawMtnLayer(g,W,GY,.50,5,'#080118',16,.75);
  // Near range
  drawMtnLayer(g,W,GY,.66,4,'#040010',22,1);

  // Olympus peak (center)
  const ox=W*.5;
  g.fillStyle='#030008';
  g.beginPath();g.moveTo(ox-W*.22,GY);g.lineTo(ox-W*.05,GY-H*.30);
  g.bezierCurveTo(ox-W*.02,GY-H*.34,ox+W*.02,GY-H*.34,ox+W*.05,GY-H*.30);
  g.lineTo(ox+W*.22,GY);g.closePath();g.fill();
  // snow cap
  g.fillStyle='rgba(210,190,255,.1)';
  g.beginPath();g.moveTo(ox-W*.028,GY-H*.278);g.lineTo(ox,GY-H*.34);g.lineTo(ox+W*.028,GY-H*.278);g.closePath();g.fill();
  // olympus glow
  const og=g.createRadialGradient(ox,GY-H*.25,0,ox,GY-H*.25,W*.12);
  og.addColorStop(0,'rgba(120,60,200,.07)');og.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=og;g.beginPath();g.arc(ox,GY-H*.25,W*.12,0,6.28);g.fill();

  // Ground — layered rich earth
  const gr=g.createLinearGradient(0,GY,0,H);
  gr.addColorStop(0,'#0e1c06');gr.addColorStop(.18,'#0a1404');gr.addColorStop(.6,'#060d03');gr.addColorStop(1,'#030601');
  g.fillStyle=gr;g.fillRect(0,GY,W,H-GY);
  // ground edge
  g.strokeStyle='rgba(50,100,18,.65)';g.lineWidth=2.5;g.beginPath();g.moveTo(0,GY);g.lineTo(W,GY);g.stroke();
  g.strokeStyle='rgba(70,140,25,.2)';g.lineWidth=1;g.beginPath();g.moveTo(0,GY+4);g.lineTo(W,GY+4);g.stroke();
  // grass tufts
  g.strokeStyle='rgba(30,60,12,.5)';g.lineWidth=1;
  for(let i=0;i<40;i++){const gx=r()*W,gy=GY+r()*8;g.beginPath();g.moveTo(gx,gy);g.lineTo(gx+r()*6-3,gy-5-r()*4);g.stroke();}

  // Distant battlefield ruins
  drawRuins(g,W*.22,GY,H,.65);
  drawRuins(g,W*.78,GY,H,.65);
  drawRuins(g,W*.5,GY,H,.4);

  // Atmospheric haze near horizon
  const hz=g.createLinearGradient(0,GY-H*.08,0,GY);
  hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(1,'rgba(60,20,30,.12)');
  g.fillStyle=hz;g.fillRect(0,GY-H*.08,W,H*.08);

  bgDirty=false;
}

function drawMtnLayer(g,W,baseY,hFrac,peaks,color,rough,alpha){
  g.fillStyle=color;g.globalAlpha=alpha;g.beginPath();g.moveTo(0,baseY);
  const step=W/(peaks-1);
  for(let i=0;i<peaks;i++){
    const x=i*step,h=(baseY*hFrac)*(0.65+Math.sin(i*2.7+.8)*.35);
    if(i===0)g.lineTo(x,baseY-h);
    else{const px=(i-.5)*step,ph=(baseY*hFrac)*(0.65+Math.sin((i-.5)*2.7+.8)*.35);
    g.bezierCurveTo(px-step*.25,baseY-ph-rough,px+step*.25,baseY-ph+rough,x,baseY-h);}
  }
  g.lineTo(W,baseY);g.closePath();g.fill();g.globalAlpha=1;
}

function drawRuins(g,x,gy,H,alpha){
  g.globalAlpha=alpha;const ch=H*.055,cw=H*.013,gap=cw*2.1;
  g.fillStyle='rgba(6,3,16,.85)';
  for(let i=0;i<3;i++){const cx=x+i*gap*2;g.fillRect(cx,gy-ch,cw,ch);g.fillRect(cx-cw*.4,gy-ch-cw*.5,cw*1.8,cw*.5);}
  g.fillRect(x-cw,gy-ch-cw*.5,gap*5.5,cw*.3);
  g.globalAlpha=1;
}

// ─── ANIMATION STATE MACHINE ─────────────────────────────────
// States: WALK, IDLE, ATTACK_WIND, ATTACK_STRIKE, ATTACK_RECOIL, HIT, DEATH
const ST={WALK:0,IDLE:1,WIND:2,STRIKE:3,RECOIL:4,HIT:5,DEATH:6,DRAW:7,RELEASE:8};

// Each unit has animState, animPhase (0→1), animLoop
// animPhase drives all limb positions within that state

// ─── DRAWING HELPERS ─────────────────────────────────────────
function L(g,x1,y1,x2,y2,w,c){g.save();g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore();}
function RR(g,x,y,w,h,r,fill,stroke,sw){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);g.lineTo(x+w,y+h-r);g.arcTo(x+w,y+h,x+w-r,y+h,r);g.lineTo(x+r,y+h);g.arcTo(x,y+h,x,y+h-r,r);g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=sw||.9;g.stroke();}}
function ARC(g,x,y,rx,ry,fill,stroke){g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.28);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=.9;g.stroke();}}

// ─── HOPLITE DRAW ─────────────────────────────────────────────
// State-driven: walk cycle, spear thrust, shield bash, hit reel
function drawHopliteState(ctx,state,phase,isE,fury,hitFlash){
  const W=54,H=72;
  const sk=isE?'#7a1c0c':'#c09448';
  const ar=isE?'#541010':'#887018';
  const ab=isE?'#781818':'#c8a028';
  const cr=fury?'#ff2400':isE?'#6e0c0c':'#c00016';
  const sh=isE?'#4a0e0e':'#706010';
  ctx.save();
  if(isE){ctx.translate(W,0);ctx.scale(-1,1);}

  // hit flash
  if(hitFlash>0){ctx.globalAlpha=.7+hitFlash*.3;}

  let legL=0,legR=0,torsoTilt=0,spearX=0,spearY=0,spearAngle=0;
  let shieldX=0,shieldY=0,shieldAngle=0,headAngle=0,bob=0;
  let armFwdAngle=0,armBckAngle=0;

  if(state===ST.WALK){
    const w=Math.sin(phase*Math.PI*2);
    legL=w*.32;legR=-w*.32;bob=Math.abs(w)*2;
    torsoTilt=w*.04;spearX=2;spearY=0;spearAngle=-.1;
    shieldX=0;shieldY=0;shieldAngle=-.05+w*.05;
    armFwdAngle=w*.18;armBckAngle=-w*.18;

// ─── ARCHER DRAW ──────────────────────────────────────────────
// States: WALK, IDLE, DRAW (pull string), RELEASE (fire+recoil), HIT
function drawArcherState(ctx,state,phase,isE,fury,hitFlash){
  const W=52,H=70;
  const sk=isE?'#7a1c0c':'#c09448';

  ['#c8a020','#a06010','#c03010','#909020'].forEach((ac,i)=>{

  ctx.beginPath();ctx.moveTo(17,1.5);ctx.bezierCurveTo(17,-2,31,-2,31,1.5);ctx.lineTo(31,9);ctx.lineTo(17,9);ctx.closePath();ctx.fill();
  ctx.restore();

  if(hitFlash>0){ctx.fillStyle=`rgba(255,80,80,${hitFlash*.4})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

// ─── MINOTAUR DRAW ────────────────────────────────────────────
function drawMinotaurState(ctx,state,phase,isE,fury,hitFlash){
  const W=60,H=78;
  const sk=isE?'#621208':'#4a2808';
  const db=isE?'#7c1808':'#704018';
  const lb=isE?'#a02018':'#906028';
  const ey=fury?'#ff0000':'#f03018';
  ctx.save();if(isE){ctx.translate(W,0);ctx.scale(-1,1);}

  let legL=0,legR=0,bob=0,armL=0,armR=0,torsoTilt=0,headShake=0;
  let axeAngle=0,axeX=0,axeY=0,roar=0;

  if(state===ST.WALK){
    const w=Math.sin(phase*Math.PI*2);
    legL=w*.32;legR=-w*.32;bob=Math.abs(w)*3;
    armL=w*.2+.1;armR=-w*.2-.1;torsoTilt=w*.05;axeAngle=w*.1;
  } else if(state===ST.IDLE){
    const b=Math.sin(phase*Math.PI*2);bob=b*.8;armL=.1+b*.04;armR=-.1-b*.04;
    // heavy breathing motion
    axeAngle=b*.05;
  } else if(state===ST.WIND){
    // Big overhead wind-up
    armR=-1.2-phase*.6;axeAngle=-1.5-phase*.7;axeX=-4*phase;axeY=-8*phase;
    armL=.5+phase*.3;torsoTilt=-.15*phase;legL=.15;legR=-.2;bob=0;
  } else if(state===ST.STRIKE){
    // SMASH down
    const p=phase<.3?phase/.3:1-(phase-.3)/.7;
    armR=-1.2*(1-p)+.3*p;axeAngle=-1.5*(1-p)+.8*p;axeX=-4*(1-p)+2*p;axeY=-8*(1-p)+12*p;
    torsoTilt=-.15*(1-p)+.2*p;armL=.8*(1-p)+.1*p;
    legL=.15+p*.1;legR=-.2-p*.1;bob=-4*(1-p)+4*p;
    // Screen shake hint at impact
    if(phase>.25&&phase<.4){ctx.translate(Math.sin(phase*80)*2,0);}
  } else if(state===ST.RECOIL){
    armR=.3*(1-phase);axeAngle=.8*(1-phase)-.1*phase;axeY=12*(1-phase);
    torsoTilt=.2*(1-phase);bob=4*(1-phase);
  } else if(state===ST.HIT){
    // Stagger — powerful but flinches
    torsoTilt=-.3*(1-phase);bob=10*(1-phase)*Math.sin(phase*Math.PI*3);
    armL=-.3*(1-phase);armR=.5*(1-phase);headShake=-.3*(1-phase);
    legL=.2*(1-phase);legR=-.3*(1-phase);
  } else if(state===ST.DEATH){
    ctx.translate(0,H*phase*.5);ctx.rotate(phase*1.1);ctx.globalAlpha=Math.max(0,1-phase*1.1);
    roar=-1;
  }

  ctx.translate(0,bob);

  // LEGS — massive
  L(ctx,22,44, 22+Math.sin(legL)*13,58, 12,db);
  L(ctx,22+Math.sin(legL)*13,58, 20+Math.sin(legL)*14,70, 10,sk);
  ctx.fillStyle='#0a0404';ctx.beginPath();ctx.ellipse(20+Math.sin(legL)*14,70,7,3.2,legL*.3,0,6.28);ctx.fill();
  L(ctx,32,44, 32+Math.sin(legR)*13,58, 12,db);
  L(ctx,32+Math.sin(legR)*13,58, 34+Math.sin(legR)*14,70, 10,sk);
  ctx.fillStyle='#0a0404';ctx.beginPath();ctx.ellipse(34+Math.sin(legR)*14,70,7,3.2,legR*.3,0,6.28);ctx.fill();

  // TORSO
  ctx.save();ctx.translate(27,33);ctx.rotate(torsoTilt);ctx.translate(-27,-33);
  RR(ctx,11,20,29,24,4,lb,db,1.3);
  ctx.fillStyle=db;ctx.beginPath();ctx.ellipse(20,29,10,7,-.18,0,6.28);ctx.fill();
  ctx.beginPath();ctx.ellipse(33,29,10,7,.18,0,6.28);ctx.fill();
  ctx.strokeStyle=db;ctx.lineWidth=1.4;[36,39.5,43].forEach(y=>{ctx.beginPath();ctx.moveTo(14,y);ctx.lineTo(40,y);ctx.stroke();});
  ctx.beginPath();ctx.moveTo(27,27);ctx.lineTo(27,45);ctx.stroke();
  ctx.strokeStyle=lb;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(14,22);ctx.lineTo(27,18);ctx.lineTo(40,22);ctx.stroke();

  // LEFT ARM (off hand)
  ctx.save();ctx.translate(11,22);ctx.rotate(armL);
  L(ctx,0,0,-8,15,12,db);L(ctx,-8,15,-12,30,10,sk);
  ARC(ctx,-13,32,7.5,6,db);ctx.restore();

  // RIGHT ARM (axe arm)
  ctx.save();ctx.translate(43,22);ctx.rotate(armR);
  L(ctx,0,0,8,15,12,db);L(ctx,8,15,12,30,10,sk);
  // AXE
  ctx.save();ctx.translate(11,16+axeY);ctx.rotate(axeAngle);
  ctx.strokeStyle='#5a4008';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(3,28);ctx.stroke();
  // axe head — full double blade
  ctx.fillStyle='#909090';ctx.beginPath();ctx.moveTo(-3,-8);ctx.lineTo(8,-8);ctx.lineTo(12,4);ctx.lineTo(8,10);ctx.lineTo(-3,10);ctx.lineTo(-6,4);ctx.closePath();ctx.fill();ctx.strokeStyle='#606060';ctx.lineWidth=.9;ctx.stroke();
  ctx.strokeStyle='#e0e0e0';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(12,4);ctx.lineTo(8,10);ctx.stroke();
  // wrap
  ctx.strokeStyle='#8a6010';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-.5,0);ctx.lineTo(.5,18);ctx.stroke();
  ctx.restore();ctx.restore();ctx.restore();

  // HEAD — massive bull
  ctx.save();ctx.translate(27,0);ctx.rotate(headShake);ctx.translate(-27,0);
  ARC(ctx,27,14,14,12,lb);ctx.strokeStyle=db;ctx.lineWidth=1.3;ctx.stroke();
  // snout
  ARC(ctx,27,21,10,7,db);
  // nostrils with detail
  ARC(ctx,22,22,2.5,1.8,'#060202');ARC(ctx,32,22,2.5,1.8,'#060202');
  ctx.fillStyle='rgba(255,30,0,.2)';ARC(ctx,22,22,4,3.5,'rgba(255,30,0,.1)');ARC(ctx,32,22,4,3.5,'rgba(255,30,0,.1)');
  // HORNS with curve
  ctx.strokeStyle=lb;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(15,9);ctx.quadraticCurveTo(7,-1,13,10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(39,9);ctx.quadraticCurveTo(47,-1,41,10);ctx.stroke();
  ctx.strokeStyle='#d8a820';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(15,9);ctx.quadraticCurveTo(7,-1,13,10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(39,9);ctx.quadraticCurveTo(47,-1,41,10);ctx.stroke();
  // EYES — glowing
  ctx.fillStyle=ey;ARC(ctx,21,13,3.2,2.5,ey);ARC(ctx,33,13,3.2,2.5,ey);
  ctx.fillStyle='#040000';ARC(ctx,21,13,1.5,1.5,'#040000');ARC(ctx,33,13,1.5,1.5,'#040000');
  // eye glow halo
  ctx.fillStyle=`rgba(255,0,0,${fury?.3:.12})`;ARC(ctx,21,13,6,5,'rgba(255,0,0,0)');ARC(ctx,33,13,6,5,'rgba(255,0,0,0)');
  // forehead ridge bone
  ctx.strokeStyle=db;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(15,10);ctx.bezierCurveTo(19,5,35,5,39,10);ctx.stroke();
  // ring in nose (detail)
  ctx.strokeStyle='#d8a820';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(27,23,3.5,Math.PI*.2,Math.PI*.8,false);ctx.stroke();
  ctx.restore();

  if(fury){ctx.fillStyle='rgba(255,30,0,.2)';ctx.beginPath();ctx.arc(27,14,22,0,6.28);ctx.fill();}
  if(hitFlash>0){ctx.fillStyle=`rgba(255,80,80,${hitFlash*.45})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

// ─── OBJECT POOLS ─────────────────────────────────────────────
const _unitPool=[],_projPool=[];
let UID=0;
const activeProjs=[];
const floaters=[];
function addFloat(x,y,txt,col){floaters.push({x,y,txt,col,life:1,vy:-.9});}

function acquireUnit(type,isP,x){
  const d=UDEFS[type];const hm=1+(S?S.upgHp*.25:0);
  let u=_unitPool.pop()||{};
  Object.assign(u,{id:++UID,type,hp:d.hp*hm,maxHp:d.hp*hm,atk:d.atk,spd:d.spd,range:d.range,
    gc:d.gc,mc:d.mc,proj:d.proj,cw:d.cw,ch:d.ch,draw:d.draw,
    atkWindTime:d.atkWindTime,atkStrikeTime:d.atkStrikeTime,atkRecoilTime:d.atkRecoilTime,
    x,isP,alive:true,fury:false,
    // Animation state machine
    animState:ST.WALK,animPhase:0,animSpeed:1,
    // Attack timing (in ticks)
    atkState:0,    // 0=ready, 1=winding, 2=striking, 3=recoiling
    atkTick:0,     // ticks in current atkState
    hitFlash:0,    // 0-1 red flash on hit
    target:null,
  });
  return u;
}
function releaseUnit(u){u.alive=false;_unitPool.push(u);}
function fireProj(from,tx){
  let p=_projPool.pop()||{};
  Object.assign(p,{x:from.x,tx,isP:from.isP,t:0,alive:true});
  activeProjs.push(p);
}
function releaseProj(p){p.alive=false;const i=activeProjs.indexOf(p);if(i>=0)activeProjs.splice(i,1);_projPool.push(p);}

// ─── GAME STATE ───────────────────────────────────────────────
let S=null;
function iS(){return{gold:80,mana:0,phps:500,phpm:500,ehps:500,ehpm:500,units:[],
  wave:1,wt:0,wi:520,gt:0,gi:72,mt:0,mi:105,
  zcd:0,zcm:280,pcd:0,pcm:220,acd:0,acm:260,
  slow:0,fury:0,upgAtk:0,upgHp:0,upgSpd:0,over:false};}

function spawn(type,isP,x){const u=acquireUnit(type,isP,x);S.units.push(u);return u;}
function rec(t){if(S.over)return;const d=UDEFS[t];if(S.gold<d.gc||S.mana<d.mc)return;S.gold-=d.gc;S.mana-=d.mc;spawn(t,true,95);updateHUD();}
function cZeus(){if(S.over||S.zcd>0||S.mana<60)return;S.mana-=60;S.zcd=S.zcm;
  S.units.filter(u=>!u.isP&&u.alive).forEach(u=>{takeDmg(u,100);addFloat(u.x,GY-30,'⚡100','#c090f8');});updateHUD();}
function cPos(){if(S.over||S.pcd>0||S.mana<40)return;S.mana-=40;S.pcd=S.pcm;S.slow=200;addFloat(W/2,GY-40,'🌊 RETARDAR','#80a8f0');updateHUD();}
function cAres(){if(S.over||S.acd>0||S.mana<50)return;S.mana-=50;S.acd=S.acm;S.fury=180;
  S.units.filter(u=>u.isP&&u.alive).forEach(u=>u.fury=true);addFloat(W/2,GY-40,'⚔ FÚRIA!','#f07050');updateHUD();}
function buyUpg(t){const c={atk:80+S.upgAtk*40,hp:100+S.upgHp*50,spd:120+S.upgSpd*60};
  if(S.gold<c[t])return;S.gold-=c[t];if(t==='atk')S.upgAtk++;else if(t==='hp')S.upgHp++;else S.upgSpd++;
  updateUpgLabels();updateHUD();}
function updateUpgLabels(){
  document.getElementById('ua').textContent=`⚔ Atq+3 (${80+S.upgAtk*40}⚙)`;
  document.getElementById('uh').textContent=`❤ Vida+25% (${100+S.upgHp*50}⚙)`;
  document.getElementById('us').textContent=`💨 Vel+15% (${120+S.upgSpd*60}⚙)`;}

function takeDmg(u,amt){
  u.hp=Math.max(0,u.hp-amt);
  u.hitFlash=1;
  u.animState=ST.HIT;u.animPhase=0;
  if(u.hp<=0){u.animState=ST.DEATH;u.animPhase=0;u.alive=false;}
}

function waveTypes(w){
  if(w<=2)return['e_soldier','e_soldier','e_archer'];
  if(w<=4)return['e_soldier','e_archer','e_centaur'];
  return['e_soldier','e_archer','e_centaur','e_giant'];}
function spawnWave(){
  const types=waveTypes(S.wave),count=2+Math.floor(S.wave*1.5);
  for(let i=0;i<count;i++){const t=types[Math.floor(Math.random()*types.length)];
    setTimeout(()=>{if(S&&!S.over)spawn(t,false,W-115-i*5);},i*300);}
  document.getElementById('wlbl').textContent='— ONDA '+(++S.wave)+' —';
  S.wi=Math.max(250,S.wi-25);}

// ─── UPDATE ───────────────────────────────────────────────────
let lastTs=0,rafId=null;
const TDT=1000/60;

function gameLoop(ts){
  if(S&&S.over){rafId=null;return;}
  rafId=requestAnimationFrame(gameLoop);
  const dt=Math.min(ts-lastTs,80);lastTs=ts;
  if(dt<8)return;
  const dts=dt/TDT;
  update(dts);render();
}

let accG=0,accM=0,accW=0;
function update(dts){
  accG+=dts;accM+=dts;accW+=dts;
  if(accG>=S.gi){S.gold=Math.min(999,S.gold+10);accG=0;}
  if(accM>=S.mi){if(S.mana<200)S.mana=Math.min(200,S.mana+5);accM=0;}
  if(accW>=S.wi){spawnWave();accW=0;}
  if(S.zcd>0)S.zcd=Math.max(0,S.zcd-dts);
  if(S.pcd>0)S.pcd=Math.max(0,S.pcd-dts);
  if(S.acd>0)S.acd=Math.max(0,S.acd-dts);
  if(S.slow>0)S.slow=Math.max(0,S.slow-dts);
  if(S.fury>0){S.fury=Math.max(0,S.fury-dts);if(S.fury<=0)S.units.forEach(u=>{if(u.isP)u.fury=false;});}

  const alive=S.units.filter(u=>u.alive||u.animState===ST.DEATH);
  const pu=alive.filter(u=>u.isP&&u.alive);
  const eu=alive.filter(u=>!u.isP&&u.alive);

  for(let i=0;i<alive.length;i++){
    const u=alive[i];
    // Advance animation phase
    const asp=u.type==='centaur'||u.type==='e_centaur'?1.3:1;
    const furySpeed=u.fury?1.4:1;
    u.animPhase+=0.016*dts*asp*furySpeed;
    if(u.hitFlash>0)u.hitFlash=Math.max(0,u.hitFlash-0.08*dts);

    if(!u.alive){
      // Play death animation then remove
      if(u.animPhase>1.2){S.units.splice(S.units.indexOf(u),1);releaseUnit(u);}
      continue;
    }

    const foes=u.isP?eu:pu;
    const dir=u.isP?1:-1;
    const sm=(S.slow>0&&!u.isP)?.42:1;
    const sp=1+(u.isP?S.upgSpd*.15:0);

    // Find closest foe
    let cl=null,cd=9999;
    for(let j=0;j<foes.length;j++){const f=foes[j];const d=Math.abs(u.x-f.x);if(d<cd){cd=d;cl=f;}}
    u.target=cl;

    const bx=u.isP?W-72:72;
    const bd=Math.abs(u.x-bx);
    const inRange=cl&&cd<=u.range;

    // ATTACK STATE MACHINE
    if(inRange||(!cl&&bd<=u.range+12)){
      // Stop moving
      if(u.atkState===0){
        // Start wind-up
        u.atkState=1;u.atkTick=0;
        u.animState=ST.WIND;u.animPhase=0;
      } else if(u.atkState===1){
        // Winding up
        u.atkTick+=dts;
        u.animPhase=u.atkTick/u.atkWindTime;
        if(u.atkTick>=u.atkWindTime){
          u.atkState=2;u.atkTick=0;
          u.animState=u.type==='archer'||u.type==='e_archer'?ST.RELEASE:ST.STRIKE;
          u.animPhase=0;
          // DEAL DAMAGE at strike moment
          const da=(u.atk+S.upgAtk*3)*(u.fury?1.5:1);
          if(inRange&&cl){
            if(u.proj)fireProj(u,cl.x);
            takeDmg(cl,da);
            if(!cl.alive){
              if(u.isP){S.gold=Math.min(999,S.gold+9);S.mana=Math.min(200,S.mana+6);addFloat(cl.x,GY-28,'+9⚙','#e8c840');}
            } else {
              addFloat(cl.x,GY-35,'-'+Math.round(da),'#f06060');
            }
          } else if(!cl){
            const d=(u.atk+S.upgAtk*3)*.38;
            if(u.isP)S.ehps=Math.max(0,S.ehps-d);else S.phps=Math.max(0,S.phps-d);
          }
        }
      } else if(u.atkState===2){
        // Strike frame
        u.atkTick+=dts;u.animPhase=u.atkTick/u.atkStrikeTime;
        if(u.atkTick>=u.atkStrikeTime){u.atkState=3;u.atkTick=0;u.animState=ST.RECOIL;u.animPhase=0;}
      } else if(u.atkState===3){
        // Recoil
        u.atkTick+=dts;u.animPhase=u.atkTick/u.atkRecoilTime;
        if(u.atkTick>=u.atkRecoilTime){
          u.atkState=0;u.animState=ST.IDLE;u.animPhase=0;
        }
      }
    } else {
      // WALK toward enemy/base
      u.atkState=0;
      if(u.animState!==ST.WALK&&u.animState!==ST.HIT){u.animState=ST.WALK;}
      if(u.animState===ST.WALK){
        u.x+=u.spd*dir*sm*sp*dts;
        u.x=Math.max(65,Math.min(W-65,u.x));
      } else if(u.animState===ST.HIT&&u.animPhase>1){
        u.animState=ST.WALK;u.animPhase=0;
      }
    }
  }

  // Update projectiles
  for(let i=activeProjs.length-1;i>=0;i--){
    const p=activeProjs[i];p.t+=0.028*dts;
    if(p.t>=1)releaseProj(p);
  }
  // Update floaters
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.y+=f.vy*dts;f.life-=0.032*dts;
    if(f.life<=0)floaters.splice(i,1);
  }
  if(S.phps<=0){endGame(false);return;}
  if(S.ehps<=0){endGame(true);return;}
  updateHUD();
}

// ─── RENDER ───────────────────────────────────────────────────
// Sprite cache — key: type_isE_state_phaseIdx_fury
const SC=new Map();
const PBUCKETS=12;
function getSprite(u){
  // Only cache WALK and IDLE — attack states are too dynamic per-unit
  const cacheable=u.animState===ST.WALK||u.animState===ST.IDLE;
  if(!cacheable){
    // Draw directly
    const oc=new OffscreenCanvas(u.cw,u.ch);
    u.draw(oc.getContext('2d'),u.animState,Math.min(u.animPhase,0.999),!u.isP,u.fury,u.hitFlash);
    return oc;
  }
  const pb=Math.floor((u.animPhase%1)*PBUCKETS);
  const key=`${u.type}_${u.isP?0:1}_${u.animState}_${pb}_${u.fury?1:0}`;
  if(SC.has(key))return SC.get(key);
  const oc=new OffscreenCanvas(u.cw,u.ch);
  u.draw(oc.getContext('2d'),u.animState,pb/PBUCKETS,!u.isP,u.fury,0);
  SC.set(key,oc);
  if(SC.size>600){SC.delete(SC.keys().next().value);}
  return oc;
}

function render(){
  if(bgDirty||!bgCanvas)buildBG();
  ctx.drawImage(bgCanvas,0,0);

  // Sort units by x (painter's algorithm for depth)
  const units=[...S.units].sort((a,b)=>a.x-b.x);

  // Draw unit shadows
  ctx.fillStyle='rgba(0,0,0,0.25)';
  for(const u of units){
    if(!u.alive&&u.animState!==ST.DEATH)continue;
    const sw=u.cw*.6,sh=u.ch*.06;
    ctx.beginPath();ctx.ellipse(u.x,GY,sw,sh,0,0,6.28);ctx.fill();
  }

  // Draw bases
  drawBase(ctx,true);drawBase(ctx,false);

  // Draw units
  for(const u of units){
    if(!u.alive&&u.animState!==ST.DEATH)continue;
    const sp=getSprite(u);
    ctx.drawImage(sp,Math.round(u.x-u.cw/2),Math.round(GY-u.ch));
    // HP bar (only alive units)
    if(u.alive){
      const bw=Math.max(22,u.cw*.65);
      const bx=Math.round(u.x-bw/2),by=GY-u.ch-6;
      const pct=u.hp/u.maxHp;
      ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx,by,bw,4);
      ctx.fillStyle=u.isP?(pct>.5?'#38b818':pct>.25?'#c8a010':'#c02020'):'#b01010';
      ctx.fillRect(bx,by,Math.round(bw*pct),4);
    }
  }

  // Projectiles
  for(const p of activeProjs){
    const px=p.x+(p.tx-p.x)*p.t;
    const py=GY-32-Math.sin(p.t*Math.PI)*20; // arc trajectory
    ctx.save();ctx.translate(px,py);
    if(!p.isP)ctx.scale(-1,1);
    ctx.fillStyle=p.isP?'#c8a028':'#b02010';
    ctx.beginPath();ctx.moveTo(0,-1.8);ctx.lineTo(13,-1.8);ctx.lineTo(15,0);ctx.lineTo(13,1.8);ctx.lineTo(0,1.8);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Floaters
  ctx.textAlign='center';ctx.font='bold 12px Georgia';
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,f.life*1.8);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';

  // Zeus flash
  if(S.zcd>S.zcm-14){
    const p=(S.zcm-S.zcd)/14;
    ctx.globalAlpha=(1-p)*.6;ctx.fillStyle='rgba(180,130,255,.3)';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  }
}

function drawBase(ctx,isP){
  const bh=Math.min(100,H*.17),bw=68;
  const bx=isP?10:W-78;
  ctx.save();if(!isP){ctx.translate(bx+bw/2,0);ctx.scale(-1,1);ctx.translate(-(bx+bw/2),0);}
  ctx.fillStyle=isP?'#3a2c0a':'#2c0c0a';ctx.fillRect(bx,GY-bh,bw,bh);
  ctx.strokeStyle=isP?'#c8a018':'#801010';ctx.lineWidth=1;ctx.strokeRect(bx,GY-bh,bw,bh);
  const ch=bh*.72,cw=10;
  [10,27,44].forEach(cx=>{
    ctx.fillStyle=isP?'#c8a018':'#901818';ctx.fillRect(bx+cx,GY-bh,cw,ch);
    ctx.strokeStyle=isP?'#8a6808':'#601010';ctx.lineWidth=.7;ctx.strokeRect(bx+cx,GY-bh,cw,ch);
    ctx.fillStyle=isP?'#d8b028':'#a02020';ctx.fillRect(bx+cx-2,GY-bh-6,cw+4,6);
  });
  ctx.fillStyle=isP?'#a07818':'#701010';ctx.fillRect(bx,GY-bh-12,bw,12);
  ctx.fillStyle=isP?'#c8a018':'#901818';ctx.beginPath();ctx.moveTo(bx,GY-bh-12);ctx.lineTo(bx+bw/2,GY-bh-26);ctx.lineTo(bx+bw,GY-bh-12);ctx.closePath();ctx.fill();
  ctx.strokeStyle=isP?'#8a6808':'#601010';ctx.lineWidth=.7;ctx.stroke();
  ctx.fillStyle=isP?'#1a1002':'#1a0402';ctx.fillRect(bx+26,GY-bh*.44,16,bh*.44);
  // HP bar below base
  const pct=isP?S.phps/S.phpm:S.ehps/S.ehpm;
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx,GY+3,bw,5);
  ctx.fillStyle=isP?'#38b818':'#c02020';ctx.fillRect(bx,GY+3,Math.round(bw*pct),5);
  ctx.restore();
}

function updateHUD(){
  document.getElementById('gv').textContent=Math.floor(S.gold);
  document.getElementById('mv').textContent=Math.floor(S.mana);
  document.getElementById('php').style.width=Math.max(0,S.phps/S.phpm*100)+'%';
  document.getElementById('ehp').style.width=Math.max(0,S.ehps/S.ehpm*100)+'%';
  document.getElementById('pht').textContent=Math.ceil(S.phps)+'/'+S.phpm;
  document.getElementById('eht').textContent=Math.ceil(S.ehps)+'/'+S.ehpm;
  const p=(n,mx)=>Math.round((mx-n)/mx*100)+'%';
  document.getElementById('zc').style.width=p(S.zcd,S.zcm);
  document.getElementById('pc').style.width=p(S.pcd,S.pcm);
  document.getElementById('ac').style.width=p(S.acd,S.acm);
  ['hoplite','archer','centaur','minotaur'].forEach(t=>{const b=document.getElementById('bn-'+t);if(b){const d=UDEFS[t];b.disabled=S.gold<d.gc||S.mana<d.mc;}});
  document.getElementById('bn-zeus').disabled=S.zcd>0||S.mana<60;
  document.getElementById('bn-pos').disabled=S.pcd>0||S.mana<40;
  document.getElementById('bn-ares').disabled=S.acd>0||S.mana<50;
  ['ua','uh','us'].forEach((id,i)=>{const c=[80+S.upgAtk*40,100+S.upgHp*50,120+S.upgSpd*60];document.getElementById(id).disabled=S.gold<c[i];});
}

function endGame(win){
  S.over=true;
  document.getElementById('ot').textContent=win?'⚡ VITÓRIA!':'💀 DERROTA!';
  document.getElementById('os').textContent=win?'Os deuses sorriem! Onda '+S.wave+' concluída!':'Esparta venceu esta batalha...';
  document.getElementById('ov').classList.add('show');
}

function restart(){
  document.getElementById('ov').classList.remove('show');
  if(S)S.units.forEach(u=>releaseUnit(u));
  activeProjs.forEach(p=>_projPool.push(p));activeProjs.length=0;
  floaters.length=0;UID=0;S=iS();accG=accM=accW=0;
  document.getElementById('wlbl').textContent='— ONDA 1 —';
  updateUpgLabels();updateHUD();spawnWave();
  if(!rafId){lastTs=performance.now();rafId=requestAnimationFrame(gameLoop);}
}

S=iS();updateHUD();spawnWave();
lastTs=performance.now();rafId=requestAnimationFrame(gameLoop);
</script>
